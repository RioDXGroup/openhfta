services:
  api:
    image: ${OPENHFTA_API_IMAGE:-openhfta-api:latest}
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    image: ${OPENHFTA_WEB_IMAGE:-openhfta-web:latest}
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
